<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="settingsTitle">Search Relay - 设置</title>
  <link rel="stylesheet" href="libs/mermaid.min.css" />
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <div class="container">
    <!-- 页面标题 -->
    <header class="header">
      <h1 data-i18n="settingsTitle">Search Relay 设置</h1>
      <p class="subtitle" data-i18n="settingsSubtitle">配置搜索引擎跳转规则</p>
    </header>

    <!-- 目标搜索引擎选择 -->
    <section class="card">
      <h2 data-i18n="currentTargetEngine">当前目标引擎</h2>
      <p class="description" data-i18n="currentTargetEngineDesc">选择点击插件图标时要跳转到的搜索引擎</p>

      <div class="form-group">
        <label for="targetEngine" data-i18n="targetEngineLabel">目标引擎</label>
        <select id="targetEngine" class="select">
          <!-- 由 JavaScript 动态填充 -->
        </select>
      </div>

      <!-- 语言选择 -->
      <div class="form-group">
        <label for="languageSelect" data-i18n="languageLabel">界面语言</label>
        <select id="languageSelect" class="select">
          <option value="auto" data-i18n="languageAuto">跟随浏览器</option>
          <option value="zh_CN" data-i18n="languageChinese">简体中文</option>
          <option value="en" data-i18n="languageEnglish">English</option>
        </select>
      </div>

      <!-- Badge 显示开关 -->
      <div class="form-group checkbox-group">
        <label class="checkbox-container">
          <input type="checkbox" id="showBadge" />
          <span class="checkbox-label" data-i18n="showBadgeLabel">在图标上显示 Badge 文字</span>
        </label>
        <p class="hint" data-i18n="showBadgeHint">
          开启后将在插件图标上显示当前搜索引擎的缩写（如：G, B）
        </p>
      </div>
    </section>

    <!-- 搜索引擎管理 -->
    <section class="card">
      <h2 data-i18n="engineManagement">搜索引擎管理</h2>
      <p class="description" data-i18n="engineManagementDesc">
        管理所有搜索引擎。可设置每个引擎是否作为"目标引擎"（可跳转到）或"源引擎"（可从其提取关键词）。
      </p>

      <!-- 引擎列表 -->
      <div class="subsection mt-0">
        <div id="engines-grid"></div>
      </div>

      <!-- 添加/编辑引擎表单 -->
      <details id="addEngineDetails" class="subsection">
        <summary>
          <h3 data-i18n="addEditEngine">添加/编辑引擎</h3>
          <span class="toggle-icon">▼</span>
        </summary>
        <div class="card-content">
          <div class="form-row">
            <div class="form-group">
              <label for="newEngineName" data-i18n="engineName">引擎名称</label>
              <input type="text" id="newEngineName" class="input" data-i18n-placeholder="engineNamePlaceholder"
                placeholder="例如: 哔哩哔哩" />
            </div>
            <div class="form-group">
              <label for="newEngineBadge" data-i18n="badgeText">Badge 文字（推荐不超过4个字符）</label>
              <input type="text" id="newEngineBadge" class="input" data-i18n-placeholder="badgeTextPlaceholder"
                placeholder="例如: Bili" maxlength="4" />
            </div>
          </div>
          <div class="form-group">
            <label for="newEngineUrl" data-i18n="searchUrlTemplate">搜索 URL 模板</label>
            <input type="text" id="newEngineUrl" class="input" data-i18n-placeholder="searchUrlPlaceholder"
              placeholder="例如: https://search.bilibili.com/all?keyword=%s" />
            <span class="hint" data-i18n="searchUrlHint">使用
              <code>%s</code> 作为关键词占位符，域名和参数名将自动提取</span>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="newEngineDomain" data-i18n="domainMatch">域名匹配（可选，自动提取）</label>
              <input type="text" id="newEngineDomain" class="input" data-i18n-placeholder="domainPlaceholder"
                placeholder="例如: bilibili.com" />
              <span class="hint" data-i18n="domainHint">用于从该搜索引擎页面提取关键词</span>
            </div>
            <div class="form-group">
              <label for="newEngineParam" data-i18n="urlParam">URL 参数名（可选，自动提取）</label>
              <input type="text" id="newEngineParam" class="input" data-i18n-placeholder="urlParamPlaceholder"
                placeholder="例如: keyword" />
              <span class="hint" data-i18n="urlParamHint">用于从 URL 中提取搜索关键词</span>
            </div>
          </div>
          <!-- 角色复选框 -->
          <div class="form-row checkbox-row">
            <div class="form-group checkbox-group">
              <label class="checkbox-container">
                <input type="checkbox" id="newEngineIsTarget" checked />
                <span class="checkbox-label" data-i18n="isTargetEngine">作为目标引擎</span>
              </label>
              <p class="hint" data-i18n="isTargetEngineHint">勾选后可在下拉菜单和右键菜单中选择跳转到此引擎</p>
            </div>
            <div class="form-group checkbox-group">
              <label class="checkbox-container">
                <input type="checkbox" id="newEngineIsSource" />
                <span class="checkbox-label" data-i18n="isSourceEngine">作为源引擎</span>
              </label>
              <p class="hint" data-i18n="isSourceEngineHint">勾选后可从此引擎的搜索结果页面提取关键词</p>
            </div>
          </div>
          <div class="btn-group">
            <button id="addEngine" class="btn btn-primary" data-i18n="addEngineBtn">添加引擎</button>
            <button id="cancelEditEngine" class="btn btn-secondary" style="display: none" data-i18n="cancelEditBtn">
              取消编辑
            </button>
          </div>
        </div>
      </details>
    </section>

    <!-- 操作按钮 -->
    <section class="card actions">
      <button id="resetDefaults" class="btn btn-secondary" data-i18n="resetDefaults">
        恢复默认设置
      </button>
      <span id="statusMessage" class="status-message"></span>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
      <p>
        Search Relay v0.2.0 |
        <a href="https://github.com/Hakuin123/Search-Relay" target="_blank">GitHub</a>
      </p>
    </footer>
  </div>

  <script src="i18n-helper.js"></script>
  <script src="libs/gridjs.umd.js"></script>
  <script type="module" src="options.js"></script>
</body>

</html>
